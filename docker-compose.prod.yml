services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    logging: &json-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  api:
    image: ${APP_IMAGE:?APP_IMAGE must reference the reviewed V1.2 image}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      APP_ENV: "production"
      AUTO_CREATE_SCHEMA: "false"
      RUN_DB_MIGRATIONS: "false"
      LEGACY_WRITE_ENABLED: "false"
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      # 宝塔宿主 Nginx 覆写 x-real-ip，回环容器网关仅转发该值；
      # 直连部署（无该反代）严禁沿用此值。
      TRUST_PROXY_HEADERS: "true"
    logging: *json-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    image: ${APP_IMAGE:?APP_IMAGE must reference the reviewed V1.2 image}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      APP_ENV: "production"
      AUTO_CREATE_SCHEMA: "false"
      LEGACY_WRITE_ENABLED: "false"
      PUBLIC_POOL_AUTO_REMATCH_ENABLED: ${PUBLIC_POOL_AUTO_REMATCH_ENABLED:-0}
      # 与 api 对齐：启动校验要求该开关显式声明，不依赖部署方记得写进 .env。
      TRUST_PROXY_HEADERS: "true"
    logging: *json-logging

  lead-export-worker:
    image: ${APP_IMAGE:?APP_IMAGE must reference the reviewed V1.2 image}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=640m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      APP_ENV: "production"
      AUTO_CREATE_SCHEMA: "false"
      LEGACY_WRITE_ENABLED: "false"
      TRUST_PROXY_HEADERS: "true"
      TMPDIR: /tmp
    logging: *json-logging

  nginx:
    ports:
      # TLS is terminated by BaoTa. Keep this HTTP gateway unreachable from
      # the public network so only BaoTa can supply trusted proxy headers.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    volumes:
      - ./infra/nginx/baota-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  default:
    name: zhongshu-production
