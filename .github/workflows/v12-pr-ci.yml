name: V1.2 Pull Request CI

on:
  pull_request:
    branches:
      - release/v1.2.5
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: v12-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt

      - name: Verify installed dependencies
        run: pip check

      - name: Audit Python dependencies
        shell: bash
        run: |
          {
            cat requirements.txt
            printf '\n'
            cat requirements-postgres.txt
            printf '\n'
            cat requirements-browser.txt
            printf '\n'
          } > /tmp/v12-requirements.txt
          pip-audit -r /tmp/v12-requirements.txt --progress-spinner off

      - name: Run backend tests
        shell: bash
        run: |
          mkdir -p dist/quality
          set +e
          pytest -q > dist/quality/pytest-output.txt 2>&1
          status=$?
          cat dist/quality/pytest-output.txt
          if [ "$status" -ne 0 ]; then
            python -c "from pathlib import Path; text=Path('dist/quality/pytest-output.txt').read_text(encoding='utf-8', errors='replace')[-6000:]; text=text.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'); print('::error title=Pytest failed::'+text)"
            exit "$status"
          fi

      - name: Export V1.2 OpenAPI contract
        run: python scripts/export_openapi.py --output dist/openapi/openapi.json

      - name: Run JavaScript checks
        run: python scripts/check_js.py

      - name: Scan repository secrets
        run: python scripts/secret_scan.py

      - name: Compile Python sources
        run: python -m compileall -q apps scripts migrations

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify release metadata
        run: python scripts/check_release_metadata.py

      - name: Verify V1.0.1 to V1.2 migration on SQLite
        shell: bash
        env:
          DATABASE_URL: sqlite:///./dist/v12-migration-smoke.db
        run: |
          set +e
          mkdir -p dist/quality
          {
            python -m alembic -c alembic.ini upgrade head &&
            python -m alembic -c alembic.ini downgrade 0001_initial &&
            python -m alembic -c alembic.ini upgrade head
          } > dist/quality/migration-output.txt 2>&1
          status=$?
          cat dist/quality/migration-output.txt
          if [ "$status" -ne 0 ]; then
            python -c "from pathlib import Path; text=Path('dist/quality/migration-output.txt').read_text(encoding='utf-8', errors='replace')[-6000:]; text=text.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'); print('::error title=Migration smoke failed::'+text)"
            exit "$status"
          fi

      - name: Build reviewed V1.2 release candidate package
        run: python scripts/package_release.py --version V1.2.5-rc --output-dir dist/release

      - name: Upload generated OpenAPI contract
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: v12-openapi-${{ github.run_id }}
          path: dist/openapi/openapi.json
          if-no-files-found: error

      - name: Upload V1.2 release candidate package
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: v12-release-package-${{ github.run_id }}
          path: dist/release
          if-no-files-found: error

  postgres-migration:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://zhongshu:ci-postgres-password@127.0.0.1:5432/zhongshu_ci
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: ci-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: ci-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Create V1.0.1 schema, historical fixture and PII-free baseline
        run: |
          mkdir -p dist
          python -m alembic -c alembic.ini upgrade 0001_initial
          python scripts/seed_v101_migration_fixture.py
          python scripts/baseline_v101.py --output dist/v101-baseline.json

      - name: Upgrade PostgreSQL to V1.2 and backfill historical data
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/migrate_v12_data.py --dry-run --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/migrate_v12_data.py --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/verify_v12_postgres_migration.py > dist/v12-postgres-verification.json
          python -m json.tool dist/v12-postgres-verification.json >/dev/null

      - name: Verify PostgreSQL downgrade and clean re-upgrade
        run: |
          python -m alembic -c alembic.ini downgrade 0001_initial
          python -m alembic -c alembic.ini upgrade head

      - name: Verify return and notification concurrency on PostgreSQL
        env:
          V12_E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          RETURN_POSTGRES_TEST_URL: ${{ env.DATABASE_URL }}
        run: >-
          python -m pytest apps/api/tests/test_notification_postgres_concurrency_e2e.py
          apps/api/tests/test_return_concurrency_postgres.py
          apps/api/tests/test_reward_auto_confirm_postgres.py -q

      - name: Verify invite-used-by migration symmetry on PostgreSQL
        env:
          INVITE_MIGRATION_POSTGRES_TEST_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest apps/api/tests/test_invite_used_by_migration_postgres.py -q

      - name: Verify H04 dataset creation on PostgreSQL
        env:
          H04_POSTGRES_DATASET_TEST_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest apps/api/tests/test_prepare_performance_dataset.py::test_prepare_dataset_flush_order_on_postgresql -q

      - name: Upload PostgreSQL migration evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: v12-postgres-migration-${{ github.run_id }}
          path: |
            dist/v101-baseline.json
            dist/v12-postgres-verification.json
          if-no-files-found: error

  production-lifecycle-e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_e2e_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V12_E2E_DATABASE_URL: postgresql+psycopg://zhongshu:ci-postgres-password@127.0.0.1:5432/zhongshu_e2e_ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run V1.2 production lifecycle E2E on fresh PostgreSQL
        run: python scripts/run_v12_e2e.py

      - name: Upload production lifecycle E2E evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: v12-production-lifecycle-e2e-${{ github.run_id }}
          path: |
            dist/e2e/v12-production-lifecycle-evidence.json
            dist/e2e/v12-production-lifecycle.xml
          if-no-files-found: error

  browser-smoke:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:///./dist/v12-browser-smoke.db
      APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Initialize isolated browser database
        run: |
          mkdir -p dist/browser-smoke
          python scripts/init_db.py
          python scripts/seed_demo.py

      - name: Start API and run Chromium smoke
        shell: bash
        run: |
          uvicorn apps.api.src.main:app --host 127.0.0.1 --port 8000 > dist/browser-smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          python scripts/browser_smoke_v12.py --output-dir dist/browser-smoke

      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: v12-browser-smoke-${{ github.run_id }}
          path: dist/browser-smoke
          if-no-files-found: error
