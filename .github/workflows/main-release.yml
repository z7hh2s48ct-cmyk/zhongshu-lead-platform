name: Main Release Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance_action:
        description: Protected staging performance action
        required: true
        default: none
        type: choice
        options:
          - none
          - run
          - finalize
      performance_run_id:
        description: Preview workflow run ID required by finalize
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_action != 'none' && format('staging-performance-{0}', github.ref) || format('main-release-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.performance_action != 'none') }}

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt

      - name: Verify installed dependencies
        run: pip check

      - name: Audit Python dependencies
        shell: bash
        run: |
          {
            cat requirements.txt
            printf '\n'
            cat requirements-postgres.txt
            printf '\n'
            cat requirements-browser.txt
            printf '\n'
          } > /tmp/main-release-requirements.txt
          pip-audit -r /tmp/main-release-requirements.txt --progress-spinner off

      - name: Run backend tests with coverage gate
        shell: bash
        run: |
          mkdir -p dist/coverage
          set +e
          pytest \
            --cov=apps.api.src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:dist/coverage/coverage.xml \
            --cov-report=json:dist/coverage/coverage.json \
            --cov-fail-under=74 \
            > dist/coverage/pytest-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > dist/coverage/pytest-exit-code.txt
          cat dist/coverage/pytest-output.txt
          exit "$status"

      - name: Enforce line branch and critical coverage floors
        if: always()
        run: python scripts/check_coverage_gate.py --coverage dist/coverage/coverage.json --output dist/coverage/critical-coverage.json

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: main-coverage-${{ github.run_id }}
          path: dist/coverage
          if-no-files-found: error
          retention-days: 30

      - name: Generate current OpenAPI contract
        run: python scripts/export_openapi.py --output dist/openapi/openapi.json

      - name: Run JavaScript checks
        run: python scripts/check_js.py

      - name: Scan repository secrets
        run: python scripts/secret_scan.py

      - name: Compile Python sources
        run: python -m compileall -q apps scripts migrations

      - name: Validate performance and capacity contract
        run: |
          python scripts/performance_v12.py --dataset performance/v12-staging-dataset.example.json --validate-config
          python scripts/check_performance_gate.py --help >/dev/null
          python scripts/finalize_performance_report.py --help >/dev/null

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify release metadata and main workflow contract
        run: python scripts/check_release_metadata.py

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://zhongshu:ci-postgres-password@127.0.0.1:5432/zhongshu_ci
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: ci-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: ci-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Create V1.0.1 PostgreSQL baseline
        run: |
          mkdir -p dist
          python -m alembic -c alembic.ini upgrade 0001_initial
          python scripts/seed_v101_migration_fixture.py

      - name: Upgrade PostgreSQL to current head and verify V1.2 data migration
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/migrate_v12_data.py --dry-run --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/migrate_v12_data.py --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/verify_v12_postgres_migration.py > dist/v12-postgres-verification.json
          python -m json.tool dist/v12-postgres-verification.json >/dev/null

      - name: Verify PostgreSQL downgrade and clean re-upgrade
        run: |
          python -m alembic -c alembic.ini downgrade 0001_initial
          python -m alembic -c alembic.ini upgrade head

      - name: Verify return and notification concurrency on PostgreSQL
        env:
          V12_E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          RETURN_POSTGRES_TEST_URL: ${{ env.DATABASE_URL }}
        run: >-
          python -m pytest apps/api/tests/test_notification_postgres_concurrency_e2e.py
          apps/api/tests/test_return_concurrency_postgres.py
          apps/api/tests/test_reward_auto_confirm_postgres.py -q

      - name: Verify invite-used-by migration symmetry on PostgreSQL
        env:
          INVITE_MIGRATION_POSTGRES_TEST_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest apps/api/tests/test_invite_used_by_migration_postgres.py -q

      - name: Verify H04 dataset creation on PostgreSQL
        env:
          H04_POSTGRES_DATASET_TEST_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest apps/api/tests/test_prepare_performance_dataset.py::test_prepare_dataset_flush_order_on_postgresql -q

  staging-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_action == 'run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging-performance
    env:
      DATABASE_URL: ${{ secrets.V12_PERF_DATABASE_URL }}
      V12_PERF_OPERATOR_USERNAME: ${{ secrets.V12_PERF_OPERATOR_USERNAME }}
      V12_PERF_OPERATOR_PASSWORD: ${{ secrets.V12_PERF_OPERATOR_PASSWORD }}
      V12_PERF_RECEIVER_USERNAME: ${{ secrets.V12_PERF_RECEIVER_USERNAME }}
      V12_PERF_RECEIVER_PASSWORD: ${{ secrets.V12_PERF_RECEIVER_PASSWORD }}
      V12_PERF_OWNER_USERNAME: ${{ secrets.V12_PERF_OWNER_USERNAME }}
      V12_PERF_OWNER_PASSWORD: ${{ secrets.V12_PERF_OWNER_PASSWORD }}
      V12_PERF_DATASET_JSON: ${{ secrets.V12_PERF_DATASET_JSON }}
      V12_PERF_STAGING_BASE_URL: ${{ secrets.V12_PERF_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install performance dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Materialize protected synthetic inputs
        shell: bash
        run: |
          mkdir -p dist/performance
          printf '%s' "$V12_PERF_DATASET_JSON" > "$RUNNER_TEMP/v12-performance-dataset.json"

      - name: Run staging performance and capacity suite
        run: |
          python scripts/performance_v12.py \
            --dataset "$RUNNER_TEMP/v12-performance-dataset.json" \
            --base-url "$V12_PERF_STAGING_BASE_URL" \
            --profiles 100,300,500 \
            --source-commit "$GITHUB_SHA" \
            --output dist/performance/v12-performance-report.json

      - name: Enforce unsigned engineering performance gate
        run: |
          python scripts/check_performance_gate.py \
            --report dist/performance/v12-performance-report.json \
            --allow-pending-signoff \
            --allow-pending-infrastructure \
            --output dist/performance/v12-performance-gate.json

      - name: Upload staging performance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: staging-performance-${{ github.run_id }}
          path: dist/performance
          if-no-files-found: error
          retention-days: 30

  staging-performance-finalize:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_action == 'finalize' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-performance
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      V12_PERF_PREVIEW_RUN_ID: ${{ inputs.performance_run_id }}
      V12_PERF_SIGNOFF_JSON: ${{ secrets.V12_PERF_SIGNOFF_JSON }}
      V12_PERF_TARGET_METRICS_JSON: ${{ secrets.V12_PERF_TARGET_METRICS_JSON }}
      V12_PERF_METRICS_EXPORT_BASE64: ${{ secrets.V12_PERF_METRICS_EXPORT_BASE64 }}
    steps:
      - name: Checkout trusted final gate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate and download immutable preview performance artifact
        shell: bash
        run: |
          case "$V12_PERF_PREVIEW_RUN_ID" in
            ''|*[!0-9]*) echo "performance_run_id must be numeric"; exit 1 ;;
          esac
          gh run view "$V12_PERF_PREVIEW_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,headBranch,headSha \
            > "$RUNNER_TEMP/v12-performance-preview-run.json"
          python - "$RUNNER_TEMP/v12-performance-preview-run.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          metadata = json.loads(open(sys.argv[1], encoding="utf-8").read())
          expected = {
              "conclusion": "success",
              "event": "workflow_dispatch",
              "headBranch": "main",
              "headSha": sys.argv[2],
          }
          if metadata != expected:
              raise SystemExit(f"preview workflow run is not bound to this trusted main commit: {metadata!r}")
          PY
          mkdir -p dist/performance/preview
          gh run download "$V12_PERF_PREVIEW_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "staging-performance-$V12_PERF_PREVIEW_RUN_ID" \
            --dir dist/performance/preview

      - name: Materialize signoff and monitoring evidence
        shell: bash
        run: |
          mkdir -p dist/performance
          printf '%s' "$V12_PERF_SIGNOFF_JSON" > "$RUNNER_TEMP/v12-performance-signoff.json"
          printf '%s' "$V12_PERF_TARGET_METRICS_JSON" > "$RUNNER_TEMP/v12-performance-target-metrics.json"
          printf '%s' "$V12_PERF_METRICS_EXPORT_BASE64" \
            | base64 --decode > dist/performance/v12-target-monitoring-export.bin

      - name: Bind signed evidence to downloaded preview report
        run: |
          python scripts/finalize_performance_report.py \
            --preview-report dist/performance/preview/v12-performance-report.json \
            --target-metrics "$RUNNER_TEMP/v12-performance-target-metrics.json" \
            --signoff "$RUNNER_TEMP/v12-performance-signoff.json" \
            --github-run-id "$V12_PERF_PREVIEW_RUN_ID" \
            --expected-source-commit "$GITHUB_SHA" \
            --output dist/performance/v12-performance-report.signed.json

      - name: Enforce signed final performance gate
        run: |
          python scripts/check_performance_gate.py \
            --report dist/performance/v12-performance-report.signed.json \
            --metrics-export dist/performance/v12-target-monitoring-export.bin \
            --preview-report dist/performance/preview/v12-performance-report.json \
            --expected-source-commit "$GITHUB_SHA" \
            --output dist/performance/v12-performance-gate.final.json

      - name: Upload signed final performance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: staging-performance-final-${{ github.run_id }}
          path: dist/performance
          if-no-files-found: error
          retention-days: 30
